# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1: VALIDACIÓN ──────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Verificar TypeScript
        run: npx tsc --noEmit

      - name: 🧹 Ejecutar ESLint
        run: npm run lint || echo "⚠️ ESLint encontró problemas (no bloqueante)"

      - name: 🔒 Auditoría de seguridad
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnerabilidades encontradas (revisar)"

  # ─── JOB 2: CONSTRUCCIÓN ────────────────────────────────────────────
  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 👇 CREAR EL ARCHIVO .env CON TODAS LAS VARIABLES
      - name: 📝 Crear archivo .env
        run: |
          cat << EOF > .env
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Construir aplicación
        run: npm run build

      - name: 💾 Guardar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  # ─── JOB 3: DESPLIEGUE EN VERCEL ────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Instalar Vercel CLI
        run: npm install -g vercel

      - name: 🚀 Desplegar en Vercel
        run: vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}