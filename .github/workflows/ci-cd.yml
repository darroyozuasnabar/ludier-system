# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1: VALIDACIÓN ──────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ✅ CORREGIDO
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Verificar TypeScript
        run: npx tsc --noEmit

      - name: 🧹 Ejecutar ESLint
        run: npm run lint || echo "⚠️ ESLint encontró problemas (no bloqueante)"

      - name: 🔒 Auditoría de seguridad
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnerabilidades encontradas (revisar)"

  # ─── JOB 2: CONSTRUCCIÓN ────────────────────────────────────────────
  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ✅ CORREGIDO
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Construir aplicación
        run: npm run build

      - name: 💾 Guardar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  # ─── JOB 3: DESPLIEGUE EN VERCEL ────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Instalar Vercel CLI
        run: npm install -g vercel

      - name: 🚀 Desplegar en Vercel
        run: vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Notificar despliegue exitoso
        run: echo "✅ Despliegue completado en https://grupoludier.com"