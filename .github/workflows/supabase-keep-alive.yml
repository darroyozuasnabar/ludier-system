name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (01:00 AM Perú)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "🔄 Enviando ping a Supabase..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/User?select=id&limit=1")
          
          echo "✅ Respuesta HTTP: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "🎉 Supabase está activo"
          else
            echo "⚠️ Supabase respondió con código $HTTP_CODE"
            exit 1
          fi